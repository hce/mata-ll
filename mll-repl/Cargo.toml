[package]
name = "mll-repl"
version = "0.1.5"
edition = "2024"
# Not published to crates.io (for now): it's an internal/dev tool, and it pulls
# in a heavier vendored-luajit build than the published CLI needs.
publish = false
description = "Interactive REPL for mata-ll, a Haskell subset that compiles to Lua."
license = "MIT"
repository = "https://github.com/hce/mata-ll"
homepage = "https://matall.org"

[dependencies]
# path for in-workspace builds; version used when published (mllc publishes first).
mllc = { path = "../mllc", version = "0.1.5" }
mlua = { version = "0.12", features = ["luajit", "vendored"] }
