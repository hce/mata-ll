[package]
name = "mllc-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly bindings for the mata-ll compiler (mllc)."
license = "MIT"
repository = "https://github.com/hce/mata-ll"
homepage = "https://matall.org"
readme = "README.md"
keywords = ["haskell", "lua", "compiler", "wasm", "webassembly"]
categories = ["compilers", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# path for in-workspace builds; version used when published (mllc publishes first).
mllc = { path = "../mllc", version = "0.1.0" }
wasm-bindgen = "0.2.126"
