[package]
# The `mll` name is taken on crates.io, so the package publishes as `mata-ll`
# (matching the project, repo, and matall.org); the installed binary stays `mll`
# via the [[bin]] target below. `cargo install mata-ll` provides the `mll` command.
name = "mata-ll"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "mata-ll command-line compiler and runner: compiles a Haskell subset to Lua and runs it via an embedded Lua interpreter."
license = "MIT"
repository = "https://github.com/hce/mata-ll"
homepage = "https://matall.org"
readme = "README.md"
keywords = ["haskell", "lua", "compiler", "transpiler", "cli"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "mll"
path = "src/main.rs"

[dependencies]
# path for in-workspace builds; version used when published (mllc publishes first).
mllc = { path = "../mllc", version = "0.1.4" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
clap = { version = "4.6", features = ["derive"] }
