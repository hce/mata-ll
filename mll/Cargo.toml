[package]
name = "mll"
version = "0.1.0"
edition = "2024"
description = "mata-ll command-line compiler and runner: compiles a Haskell subset to Lua and runs it via an embedded Lua interpreter."
license = "MIT"
# TODO before publishing: set a public `repository` URL; the `mllc` path
# dependency must become a version dependency.

[dependencies]
mllc = { path = "../mllc" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
clap = { version = "4.6", features = ["derive"] }
