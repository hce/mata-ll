name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --exclude mll-repl

  lua-compat:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lua: lua5_4
            bin: lua
          - lua: lua5_5
            bin: lua
          - lua: luajit
            bin: luajit
    name: "compat (${{ matrix.lua }})"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: cachix/install-nix-action@v31

      - name: Build compiler
        run: cargo build --release

      - name: Run compat tests
        run: nix shell nixpkgs#${{ matrix.lua }} -c ./mll-tests/lua-compat.sh ${{ matrix.bin }}

  perf:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: cachix/install-nix-action@v31

      - name: Build compiler
        run: cargo build --release

      - name: Performance test (LuaJIT)
        run: nix shell nixpkgs#luajit -c ./mll-tests/perf-test.sh luajit

  merge:
    needs: [test, lua-compat, perf]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge dev into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/dev --ff-only
          git push origin main

  wasm:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack (pinned)
        env:
          WASM_PACK_VERSION: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          cd "$RUNNER_TEMP"
          NAME="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$NAME.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/${NAME}.tar.gz"
          echo "${WASM_PACK_SHA256}  ${NAME}.tar.gz" | sha256sum -c -
          tar xzf "$NAME.tar.gz"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$NAME/wasm-pack" "$HOME/.local/bin/wasm-pack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-pack" --version

      - name: Build wasm
        run: wasm-pack build mllc-wasm --target web --out-dir ../web/test/pkg

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: mllc-wasm
          path: web/test/pkg/
